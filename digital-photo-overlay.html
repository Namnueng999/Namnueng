<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>OBS Overlay – Digital Photo Display</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Noto Sans Thai',sans-serif}

/* ── Particles ── */
.ptc{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.p{position:absolute;border-radius:50%;animation:rise linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(110vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.4}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* ── Wipe ── */
.wipe{position:absolute;inset:0;background:linear-gradient(135deg,#08080e,#0e061c);z-index:50;transform:translateX(-100%);transition:transform .65s cubic-bezier(.77,0,.175,1)}
.wipe.in{transform:translateX(0)}.wipe.out{transform:translateX(100%)}

/* ── Stage ── */
.stage{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:1}

/* ── Idle ── */
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:2}
.idle.vis{opacity:1}
.idle-ico{font-size:80px;animation:flt 4s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.idle-txt{font-size:30px;color:rgba(255,255,255,.45);font-weight:300;letter-spacing:.1em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.idle-sub{font-size:17px;color:rgba(255,255,255,.22);letter-spacing:.2em;text-transform:uppercase}

/* ── Photo frame (Polaroid) ── */
.frame{opacity:0;transform:scale(.88) translateY(-28px);transition:opacity .85s cubic-bezier(.34,1.56,.64,1),transform .85s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 32px 64px rgba(0,0,0,.9));z-index:3}
.frame.vis{opacity:1;transform:scale(1) translateY(0)}
.polaroid{background:#fff;padding:16px 16px 8px;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.75),0 4px 12px rgba(0,0,0,.5)}
.polaroid.rl{transform:rotate(-2.5deg)}.polaroid.rr{transform:rotate(1.8deg)}.polaroid.rc{transform:rotate(-.5deg)}

/* รูปใน polaroid — ใช้ div + background-image */
.pimg{width:568px;height:420px;background:center/cover no-repeat #1a1a1a;display:block;border-radius:2px}
.pbot{height:14px;background:#fff}

/* ── Info box ── */
.info{margin-top:22px;background:rgba(6,6,12,.88);backdrop-filter:blur(24px) saturate(200%);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:22px 44px;min-width:600px;max-width:760px;text-align:center;position:relative;overflow:hidden;opacity:0;transform:translateY(30px);transition:opacity .85s ease .38s,transform .85s ease .38s;box-shadow:0 20px 60px rgba(0,0,0,.7);z-index:3}
.info.vis{opacity:1;transform:translateY(0)}
.info::before{content:'';position:absolute;top:0;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#a78bfa,#06C755,#a78bfa,transparent)}

.urow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}
/* avatar — background-image */
.uava{width:50px;height:50px;border-radius:50%;background:rgba(167,139,250,.15) center/cover no-repeat;border:2px solid rgba(167,139,250,.6);box-shadow:0 0 20px rgba(167,139,250,.35);flex-shrink:0}
.uname{font-size:26px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5)}

.srow{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;min-height:0}
.stag{font-size:15px;color:rgba(255,255,255,.62);background:rgba(255,255,255,.07);padding:4px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.1)}

.umsg{font-size:20px;color:rgba(255,255,255,.9);line-height:1.6;font-style:italic;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);text-shadow:0 1px 4px rgba(0,0,0,.5)}
.umsg::before{content:'\201C ';color:rgba(167,139,250,.7);font-style:normal;font-size:28px}
.umsg::after{content:' \201D';color:rgba(167,139,250,.7);font-style:normal;font-size:28px}

/* ── Progress bar ── */
.prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.07);opacity:0;transition:opacity .5s;z-index:10}
.prog.vis{opacity:1}
.pf{height:100%;background:linear-gradient(90deg,#a78bfa,#06C755);transform-origin:left;transform:scaleX(0)}
</style>
</head>
<body>

<div class="ptc" id="ptc"></div>
<div class="wipe" id="wipe"></div>

<div class="stage">
  <!-- Idle -->
  <div class="idle vis" id="idle">
    <div class="idle-ico">🎉</div>
    <div class="idle-txt">รอรูปจากผู้ร่วมงาน</div>
    <div class="idle-sub">Send your photo to the screen</div>
  </div>

  <!-- Photo -->
  <div class="frame" id="frame">
    <div class="polaroid rc" id="pol">
      <div class="pimg" id="dImg"></div>
      <div class="pbot"></div>
    </div>
  </div>

  <!-- Info -->
  <div class="info" id="info">
    <div class="urow">
      <div class="uava" id="uAva"></div>
      <div class="uname" id="uName"></div>
    </div>
    <div class="srow" id="sRow"></div>
    <div class="umsg" id="uMsg" style="display:none"></div>
  </div>
</div>

<div class="prog" id="prog"><div class="pf" id="pf"></div></div>

<script>
const API      = 'https://script.google.com/macros/s/AKfycbyxZPU2Y-BJrZE2vzkYUS6VVxl8NOULz_0mf_X8lIRfpYNIVdbKdpQkTqRd_43DmvQ/exec';
const SHOW_MS  = 12000;
const POLL_MS  = 4000;

let queue  = [], qIdx = 0, curId = null, busy = false;
let showTm = null, progTm = null;

/* ── Particles ─────────────────────────────── */
(function(){
  const c = document.getElementById('ptc');
  const cols = ['rgba(167,139,250,.15)','rgba(6,199,85,.12)','rgba(255,255,255,.08)','rgba(251,191,36,.1)'];
  for (let i=0; i<22; i++) {
    const el = document.createElement('div');
    el.className = 'p';
    const sz = 3 + Math.floor(Math.random()*6);
    el.style.cssText = 'width:'+sz+'px;height:'+sz+'px;background:'+cols[~~(Math.random()*cols.length)]+
      ';left:'+Math.random()*100+'%;animation-duration:'+(8+Math.random()*12)+'s;animation-delay:'+Math.random()*10+'s';
    c.appendChild(el);
  }
})();

function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ── Idle / Show ────────────────────────────── */
function showIdle() {
  document.getElementById('idle').classList.add('vis');
  document.getElementById('frame').classList.remove('vis');
  document.getElementById('info').classList.remove('vis');
  document.getElementById('prog').classList.remove('vis');
  clearTimeout(showTm);
}

async function showPhoto(item) {
  if (busy) return;
  busy = true;

  // wipe in
  const wipe = document.getElementById('wipe');
  wipe.className = 'wipe in';
  await delay(700);

  // hide elements
  document.getElementById('idle').classList.remove('vis');
  document.getElementById('frame').classList.remove('vis');
  document.getElementById('info').classList.remove('vis');

  // ── รูปหลัก: ใช้ background-image — ไม่มีปัญหา CORS/hotlink ──
  document.getElementById('dImg').style.backgroundImage = "url('" + item.imageUrl + "')";

  // rotation
  const rots = ['rl','rr','rc'];
  document.getElementById('pol').className = 'polaroid ' + rots[~~(Math.random()*3)];

  // avatar — background-image
  const ava = document.getElementById('uAva');
  if (item.profilePic && item.profilePic.startsWith('http')) {
    ava.style.backgroundImage = "url('" + item.profilePic + "')";
  } else {
    ava.style.backgroundImage = '';
    ava.style.fontSize = '28px';
    ava.textContent = '👤';
  }

  // name
  document.getElementById('uName').textContent = item.displayName || 'Unknown';

  // socials
  const sr = document.getElementById('sRow');
  sr.innerHTML = '';
  if (item.facebook)  sr.innerHTML += '<span class="stag">📘 '  + esc(item.facebook)  + '</span>';
  if (item.instagram) sr.innerHTML += '<span class="stag">📷 @' + esc(item.instagram) + '</span>';

  // message
  const um = document.getElementById('uMsg');
  if (item.message) { um.textContent = item.message; um.style.display = 'block'; }
  else              { um.style.display = 'none'; }

  // wipe out — ไม่รอรูปโหลดเพราะใช้ background-image ซึ่งโหลด async
  wipe.className = 'wipe out';
  await delay(80);
  wipe.className = 'wipe';

  document.getElementById('frame').classList.add('vis');
  document.getElementById('info').classList.add('vis');

  busy = false;
  startProg(SHOW_MS);
  clearTimeout(showTm);
  showTm = setTimeout(nextPhoto, SHOW_MS);
}

function startProg(ms) {
  const prog = document.getElementById('prog');
  const pf   = document.getElementById('pf');
  prog.classList.add('vis');
  pf.style.transition = 'none';
  pf.style.transform  = 'scaleX(0)';
  clearTimeout(progTm);
  progTm = setTimeout(() => {
    pf.style.transition = 'transform ' + ms + 'ms linear';
    pf.style.transform  = 'scaleX(1)';
  }, 60);
}

function nextPhoto() {
  if (!queue.length) { showIdle(); curId = null; return; }
  qIdx  = (qIdx + 1) % queue.length;
  curId = queue[qIdx].id;
  showPhoto(queue[qIdx]);
}

/* ── POLL ───────────────────────────────────── */
function xhrGet(url) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.onload = function() {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch(_) { reject(new Error('parse error')); }
    };
    xhr.onerror   = () => reject(new Error('network error'));
    xhr.ontimeout = () => reject(new Error('timeout'));
    xhr.send();
  });
}

async function poll() {
  try {
    const d = await xhrGet(API + '?action=getApproved');
    if (!d || !d.data) return;

    const prevIds  = new Set(queue.map(i => i.id));
    const newItems = d.data.filter(i => !prevIds.has(i.id));
    queue = d.data;

    if (newItems.length && !busy) {
      // แสดงรูปใหม่ทันที
      clearTimeout(showTm);
      const newest = newItems[newItems.length - 1];
      qIdx  = queue.findIndex(i => i.id === newest.id);
      curId = newest.id;
      showPhoto(newest);
    } else if (queue.length && !curId && !busy) {
      // เริ่ม cycle
      qIdx  = queue.length - 1;
      curId = queue[qIdx].id;
      showPhoto(queue[qIdx]);
    } else if (!queue.length) {
      showIdle(); curId = null;
    }
  } catch(e) {
    console.error('poll error:', e);
  }
}

function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Boot ───────────────────────────────────── */
showIdle();
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
