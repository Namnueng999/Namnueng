<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>OBS Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'Noto Sans Thai',sans-serif}

/* ══ LAYOUT — รูปซ้าย ข้อความขวา ══ */
.stage{
  width:100%;height:100%;
  display:flex;flex-direction:row;
  align-items:center;justify-content:center;
  gap:64px;
  padding:60px 80px;
}

/* ══ รูป (ซ้าย) ══ */
.photo-wrap{
  flex-shrink:0;
  width:680px;height:680px;
  position:relative;
}

/* Polaroid frame */
.polaroid{
  width:100%;height:100%;
  background:#fff;
  padding:18px 18px 60px;
  border-radius:4px;
  box-shadow:0 32px 80px rgba(0,0,0,.85), 0 6px 20px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  position:relative;
}

/* รูปใน polaroid */
.pimg{
  width:100%;height:100%;
  background:center/cover no-repeat #1a1a1a;
  border-radius:2px;
}

/* ══ ข้อความ (ขวา) ══ */
.info-wrap{
  flex:1;
  display:flex;flex-direction:column;
  justify-content:center;
  gap:28px;
  min-width:0;
}

/* ชื่อผู้ส่ง */
.user-row{
  display:flex;align-items:center;gap:20px;
}

.u-ava{
  width:72px;height:72px;flex-shrink:0;
  border-radius:50%;
  background:rgba(167,139,250,.2) center/cover no-repeat;
  border:3px solid rgba(167,139,250,.6);
  box-shadow:0 0 24px rgba(167,139,250,.4);
  font-size:36px;display:flex;align-items:center;justify-content:center;
}

.u-name{
  font-size:52px;
  font-weight:900;
  color:#ffffff;
  line-height:1.1;
  text-shadow:0 4px 16px rgba(0,0,0,.7);
  letter-spacing:-.01em;
  word-break:break-word;
}

/* โซเชียล */
.social-row{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;
}

.stag{
  font-size:28px;
  color:rgba(255,255,255,.75);
  background:rgba(255,255,255,.1);
  padding:6px 20px;
  border-radius:50px;
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:10px;
}
.stag svg{width:28px;height:28px;flex-shrink:0}
.stag .icon-fb{background:#1877F2;border-radius:50%;padding:5px}
.stag .icon-ig{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);border-radius:50%;padding:5px}
.stag .icon-fb,.stag .icon-ig{width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-sizing:border-box}
.stag .icon-fb svg,.stag .icon-ig svg{width:100%;height:100%;fill:#fff}

/* ── Logo มุมขวาบนของกรอบรูป ── */
.logo-corner{
  position:absolute;
  top:32px;right:32px;
  max-width:120px;max-height:120px;
  width:auto;height:auto;
  object-fit:contain;
  filter:drop-shadow(0 4px 14px rgba(0,0,0,.5));
  display:none;
  z-index:5;
}
.logo-corner.vis{display:block}

/* ข้อความ — กว้างแค่พอ fit content */
.msg-box{
  background:rgba(6,6,14,.75);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  padding:28px 36px;
  position:relative;
  overflow:hidden;
  display:inline-block;  /* หดให้พอดีข้อความ */
  max-width:100%;        /* ไม่เกินความกว้าง parent */
  align-self:flex-start; /* ชิดซ้าย ไม่ยืดเต็ม */
}

.msg-box::before{
  content:'';position:absolute;top:0;left:6%;right:6%;
  height:2px;
  background:linear-gradient(90deg,transparent,#a78bfa,#06C755,#a78bfa,transparent);
}

.msg-text{
  font-size:38px;
  font-weight:500;
  color:rgba(255,255,255,.95);
  line-height:1.5;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
  word-break:break-word;
}

.msg-text::before{content:'\201C';color:rgba(167,139,250,.8);font-size:56px;font-weight:900;margin-right:4px;line-height:0;vertical-align:-.2em}
.msg-text::after {content:'\201D';color:rgba(167,139,250,.8);font-size:56px;font-weight:900;margin-left:4px; line-height:0;vertical-align:-.2em}

/* ══ Progress bar ══ */
.prog{
  position:fixed;bottom:0;left:0;right:0;
  height:4px;background:rgba(255,255,255,.06);
  opacity:0;transition:opacity .4s;
}
.prog.vis{opacity:1}
.pf{height:100%;background:linear-gradient(90deg,#a78bfa,#06C755);transform-origin:left;transform:scaleX(0)}

/* ══ ไม่มี idle state ══ */
</style>
</head>
<body>

<div class="stage" id="stage" style="display:none">
  <!-- รูป ซ้าย -->
  <div class="photo-wrap">
    <div class="polaroid">
      <div class="pimg" id="pImg"></div>
      <img class="logo-corner" id="logoCorner" src="" alt="">
    </div>
  </div>

  <!-- ข้อความ ขวา -->
  <div class="info-wrap" id="infoWrap">
    <div class="user-row">
      <div class="u-ava" id="uAva"></div>
      <div class="u-name" id="uName"></div>
    </div>
    <div class="social-row" id="socialRow" style="display:none"></div>
    <div class="msg-box" id="msgBox" style="display:none">
      <div class="msg-text" id="msgText"></div>
    </div>
  </div>
</div>

<div class="prog" id="prog"><div class="pf" id="pf"></div></div>

<script>
const API     = 'https://script.google.com/macros/s/AKfycbyxZPU2Y-BJrZE2vzkYUS6VVxl8NOULz_0mf_X8lIRfpYNIVdbKdpQkTqRd_43DmvQ/exec';
const POLL_MS = 4000;

let queue    = [];
let curId    = null;
let showTm   = null;
let progTm   = null;
let loopOn   = true;
let showMs   = 12000;

function esc(s){ return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Facebook "f" glyph
const FB_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.675 0h-21.35C.595 0 0 .593 0 1.325v21.351C0 23.407.595 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116C23.407 24 24 23.407 24 22.676V1.325C24 .593 23.407 0 22.675 0z"/></svg>';

// Instagram glyph
const IG_SVG = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.359-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.061-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678c-3.405 0-6.162 2.76-6.162 6.162 0 3.405 2.76 6.162 6.162 6.162 3.405 0 6.162-2.76 6.162-6.162 0-3.405-2.76-6.162-6.162-6.162zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405c0 .795-.646 1.44-1.44 1.44-.795 0-1.44-.646-1.44-1.44 0-.794.646-1.439 1.44-1.439.793-.001 1.44.645 1.44 1.439z"/></svg>';

/* ── XHR ─────────────────────── */
function xhrGet(params) {
  return new Promise((resolve, reject) => {
    const qs  = Object.entries(params).map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
    const xhr = new XMLHttpRequest();
    xhr.open('GET', API + '?' + qs, true);
    xhr.timeout = 15000;
    xhr.onload  = () => { try{ resolve(JSON.parse(xhr.responseText)); }catch(_){ reject(new Error('parse')); } };
    xhr.onerror = xhr.ontimeout = () => reject(new Error('net'));
    xhr.send();
  });
}

/* ── แสดงรูป (ไม่มี animation) ── */
function showPhoto(item) {
  const stage = document.getElementById('stage');
  stage.style.display = 'flex';

  // รูป
  document.getElementById('pImg').style.backgroundImage = "url('" + item.imageUrl + "')";

  // avatar
  const ava = document.getElementById('uAva');
  if (item.profilePic && item.profilePic.startsWith('http')) {
    ava.style.backgroundImage = "url('" + item.profilePic + "')";
    ava.textContent = '';
  } else {
    ava.style.backgroundImage = '';
    ava.textContent = '👤';
  }

  // ชื่อ
  document.getElementById('uName').textContent = item.displayName || 'Unknown';

  // โซเชียล
  const sr = document.getElementById('socialRow');
  const tags = [];
  if (item.facebook) {
    tags.push('<span class="stag"><span class="icon-fb">'+FB_SVG+'</span>'+esc(item.facebook)+'</span>');
  }
  if (item.instagram) {
    tags.push('<span class="stag"><span class="icon-ig">'+IG_SVG+'</span>@'+esc(item.instagram)+'</span>');
  }

  if (tags.length) {
    sr.innerHTML = tags.join('');
    sr.style.display = 'flex';
  } else {
    sr.style.display = 'none';
  }

  // ข้อความ
  const mb = document.getElementById('msgBox');
  if (item.message) {
    document.getElementById('msgText').textContent = item.message;
    mb.style.display = 'block';
  } else {
    mb.style.display = 'none';
  }

  // progress
  startProg(showMs);

  // ตั้ง timer next
  clearTimeout(showTm);
  showTm = setTimeout(nextPhoto, showMs);
}

function startProg(ms) {
  const prog = document.getElementById('prog');
  const pf   = document.getElementById('pf');
  prog.classList.add('vis');
  pf.style.transition = 'none';
  pf.style.transform  = 'scaleX(0)';
  clearTimeout(progTm);
  progTm = setTimeout(() => {
    pf.style.transition = 'transform ' + ms + 'ms linear';
    pf.style.transform  = 'scaleX(1)';
  }, 50);
}

function nextPhoto() {
  if (!queue.length) {
    document.getElementById('stage').style.display = 'none';
    document.getElementById('prog').classList.remove('vis');
    curId = null;
    return;
  }

  // หา index ของรูปปัจจุบันใน queue ล่าสุด (queue อาจเปลี่ยนจาก poll)
  let idx = queue.findIndex(i => i.id === curId);

  if (!loopOn) {
    // ไม่ loop — หยุดหลังรูปสุดท้าย
    if (idx >= queue.length - 1) {
      document.getElementById('stage').style.display = 'none';
      document.getElementById('prog').classList.remove('vis');
      return;
    }
    idx++;
  } else {
    idx = (idx + 1) % queue.length; // idx=-1 -> 0 (เริ่มจากแรก)
  }

  curId = queue[idx].id;
  showPhoto(queue[idx]);
}

/* ── POLL ─────────────────────── */
async function poll() {
  try {
    const cfg = await xhrGet({ action: 'getConfig' });
    loopOn  = cfg.loopEnabled !== 'false';
    showMs  = Math.max(3000, parseInt(cfg.displayDuration || '12') * 1000);

    // โลโก้มุมขวาบน
    const logoEl = document.getElementById('logoCorner');
    if (cfg.logoUrl) {
      if (logoEl.src !== cfg.logoUrl) logoEl.src = cfg.logoUrl;
      logoEl.classList.add('vis');
    } else {
      logoEl.classList.remove('vis');
    }

    const d = await xhrGet({ action: 'getApproved' });
    if (!d || !d.data) return;

    queue = d.data;

    if (!curId && queue.length) {
      // ยังไม่มีรูปแสดง — เริ่มแสดงรูปแรกในคิว
      curId = queue[0].id;
      showPhoto(queue[0]);
    } else if (!queue.length) {
      document.getElementById('stage').style.display = 'none';
      document.getElementById('prog').classList.remove('vis');
      curId = null;
    }
    // ถ้ามีรูปกำลังแสดงอยู่ — ไม่ขัดจังหวะ
    // รูปใหม่จะถูกเข้าคิวและแสดงตามลำดับโดย nextPhoto()
  } catch(e) {
    console.error('poll:', e);
  }
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
