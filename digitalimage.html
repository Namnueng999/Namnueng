<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ส่งรูปขึ้นจอ</title>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap');
:root{--g:#06C755;--gd:#04a344;--bg:#0e0e12;--s1:#17171e;--s2:#1f1f28;--bd:#2b2b3a;--tx:#ededf5;--mu:#707090;--red:#ef4444;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding-bottom:48px}
.hdr{width:100%;padding:28px 20px 38px;text-align:center;background:linear-gradient(150deg,#06C755,#028a3b);position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(255,255,255,.13),transparent 70%)}
.hdr-ico{font-size:44px;position:relative;z-index:1}
.hdr h1{font-size:22px;font-weight:700;color:#fff;margin-top:6px;position:relative;z-index:1}
.hdr p{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px;position:relative;z-index:1}
.pill{width:calc(100% - 32px);max-width:480px;margin:-22px auto 0;position:relative;z-index:10;background:var(--s1);border:1px solid var(--bd);border-radius:50px;padding:10px 16px 10px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--s2);border:2px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.pn{font-size:14px;font-weight:600;flex:1}.ps{font-size:11px;color:var(--g)}
.lbtn{background:var(--g);color:#fff;border:none;padding:8px 16px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.wrap{width:calc(100% - 32px);max-width:480px;margin:20px auto 0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-bottom:11px;display:flex;align-items:center;gap:6px}
.req{color:var(--red)}.opt{font-size:10px;background:var(--s2);color:var(--mu);padding:2px 7px;border-radius:20px;font-weight:400;letter-spacing:0;text-transform:none}
.dz{border:2px dashed var(--bd);border-radius:12px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:var(--s2);transition:.25s;-webkit-tap-highlight-color:transparent}
.dz:hover,.dz.over{border-color:var(--g);background:rgba(6,199,85,.05)}
.dz-ico{font-size:46px;pointer-events:none}.dz-txt{font-size:14px;color:var(--mu);margin-top:8px;pointer-events:none}.dz-sub{font-size:11px;color:var(--mu);opacity:.65;margin-top:3px;pointer-events:none}
#fileInput{display:none}
#prevImg{width:100%;max-height:300px;object-fit:cover;border-radius:10px;display:none}
.rmbtn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;border:none;padding:5px 10px;border-radius:8px;font-size:12px;cursor:pointer;display:none;font-family:inherit;z-index:2}
.progwrap{background:var(--s2);border-radius:8px;height:5px;overflow:hidden;margin-top:10px;display:none}
.progbar{height:100%;background:linear-gradient(90deg,var(--g),#06ffaa);border-radius:8px;width:0%;transition:width .3s}
.inp{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;font-size:14px;color:var(--tx);font-family:inherit;outline:none;transition:.2s}
.inp:focus{border-color:var(--g)}.inp::placeholder{color:var(--mu)}
textarea.inp{resize:none;min-height:86px}
.ipre{display:flex;align-items:stretch;background:var(--s2);border:1px solid var(--bd);border-radius:10px;overflow:hidden;transition:.2s}
.ipre:focus-within{border-color:var(--g)}
.pre{padding:11px 12px;font-size:12px;color:var(--mu);background:var(--s1);border-right:1px solid var(--bd);white-space:nowrap;display:flex;align-items:center}
.preinp{flex:1;background:transparent;border:none;padding:11px 12px;font-size:14px;color:var(--tx);font-family:inherit;outline:none}
.preinp::placeholder{color:var(--mu)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.char{text-align:right;font-size:11px;color:var(--mu);margin-top:5px}
.sbtn{width:100%;background:linear-gradient(135deg,#06C755,#028a3b);color:#fff;border:none;padding:15px;border-radius:var(--r);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(6,199,85,.3);transition:.25s}
.sbtn:hover:not(:disabled){transform:translateY(-2px)}.sbtn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.okbox{text-align:center;padding:40px 20px;display:none}
.okico{font-size:64px;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.okbox h2{font-size:22px;font-weight:700;margin:12px 0 8px}
.okbox p{color:var(--mu);font-size:14px;line-height:1.6}
.again{margin-top:22px;background:transparent;border:1px solid var(--bd);color:var(--tx);padding:11px 24px;border-radius:12px;font-size:14px;cursor:pointer;font-family:inherit;transition:.2s}
.again:hover{border-color:var(--g);color:var(--g)}
.noln{text-align:center;padding:28px;color:var(--mu);display:none}
.noln span{font-size:44px}.noln p{font-size:14px;margin-top:10px;line-height:1.6}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:12px 20px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:240px;max-width:88vw;box-shadow:0 8px 28px rgba(0,0,0,.5);z-index:999;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--g)}.toast.err{border-color:var(--red)}
/* hidden iframe สำหรับรับ response แบบไม่ redirect หน้า */
#gasFrame{display:none;width:0;height:0;border:none}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-ico">🎉</div>
  <h1>ส่งรูปขึ้นจอ</h1>
  <p>แชร์ช่วงเวลาพิเศษของคุณ</p>
</div>

<div class="pill">
  <div class="ava" id="ava">👤</div>
  <div style="flex:1;min-width:0">
    <div class="pn" id="pName">กำลังโหลด...</div>
    <div class="ps" id="pStat">เชื่อมต่อ LINE</div>
  </div>
  <button class="lbtn" id="lBtn" onclick="doLogin()" style="display:none">เข้าสู่ระบบ</button>
</div>

<div class="wrap" id="mainWrap">
  <div class="noln" id="noln"><span>🔐</span><p>กรุณาเข้าสู่ระบบด้วย LINE<br>เพื่อส่งรูปขึ้นจอ</p></div>

  <div class="card" id="cImg" style="display:none">
    <div class="lbl">📷 รูปภาพ <span class="req">*</span></div>
    <div class="dz" id="dz" onclick="triggerFile()">
      <div class="dz-ico">🖼️</div>
      <div class="dz-txt">แตะหรือลากรูปมาวาง</div>
      <div class="dz-sub">JPG · PNG · HEIC • สูงสุด 10 MB</div>
      <img id="prevImg" alt="">
      <button class="rmbtn" id="rmBtn" onclick="rmImg(event)">✕ เปลี่ยนรูป</button>
    </div>
    <input type="file" id="fileInput" accept="image/*" onchange="onFile(event)">
    <div class="progwrap" id="progWrap"><div class="progbar" id="progBar"></div></div>
  </div>

  <div class="card" id="cSoc" style="display:none">
    <div class="lbl">🔗 โซเชียล <span class="opt">ไม่บังคับ</span></div>
    <div class="row2">
      <div class="ipre"><span class="pre">fb.com/</span><input class="preinp" id="fb" type="text" placeholder="Facebook"></div>
      <div class="ipre"><span class="pre">@</span><input class="preinp" id="ig" type="text" placeholder="Instagram"></div>
    </div>
  </div>

  <div class="card" id="cMsg" style="display:none">
    <div class="lbl">💬 ข้อความ <span class="opt">ไม่บังคับ</span></div>
    <textarea class="inp" id="msg" placeholder="ส่งความรู้สึกถึงทุกคนในงาน..." maxlength="150" oninput="cc()"></textarea>
    <div class="char"><span id="cn">0</span>/150</div>
  </div>

  <div id="subWrap" style="display:none">
    <button class="sbtn" id="subBtn" onclick="doSubmit()">
      <div class="spin" id="sp"></div>
      <span id="bTxt">🚀 ส่งรูปขึ้นจอ</span>
    </button>
  </div>

  <div class="okbox" id="okBox">
    <div class="okico">🎊</div>
    <h2>ส่งสำเร็จแล้ว!</h2>
    <p id="okMsg"></p>
    <button class="again" onclick="resetForm()">📤 ส่งรูปเพิ่มเติม</button>
  </div>
</div>

<!-- iframe รับ response จาก GAS โดยไม่ต้อง navigate หน้า -->
<iframe id="gasFrame" name="gasFrame"></iframe>

<!-- hidden form — วิธีนี้ไม่ถูก CORS block เพราะเป็น native form submit -->
<form id="gasForm" method="POST" target="gasFrame" style="display:none">
  <input type="hidden" name="action"      id="fAction"   value="submit">
  <input type="hidden" name="lineUserId"  id="fUserId">
  <input type="hidden" name="displayName" id="fName">
  <input type="hidden" name="profilePic"  id="fPic">
  <input type="hidden" name="imageBase64" id="fImg">
  <input type="hidden" name="facebook"    id="fFb">
  <input type="hidden" name="instagram"   id="fIg">
  <input type="hidden" name="message"     id="fMsg">
</form>

<div class="toast" id="toast"><span id="tIco"></span><span id="tTxt"></span></div>

<script>
/* ══════════════════════════════════════
   CONFIG
══════════════════════════════════════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyxZPU2Y-BJrZE2vzkYUS6VVxl8NOULz_0mf_X8lIRfpYNIVdbKdpQkTqRd_43DmvQ/exec';
const LIFF_ID = '2007719419-R2sSoxYq';
const MAX_PX  = 1200;
const QUALITY = 0.82;

let profile = null, imgB64 = null, ttTimer = null, submitTimeout = null;

/* ── iframe listener — รับ response จาก GAS ── */
document.getElementById('gasFrame').onload = function() {
  // iframe โหลดแล้ว = GAS ตอบกลับแล้ว
  clearTimeout(submitTimeout);
  loading(false);
  try {
    // พยายามอ่าน response จาก iframe
    const text = this.contentDocument
               ? this.contentDocument.body.innerText
               : this.contentWindow.document.body.innerText;
    if (!text || text.trim() === '') {
      // GAS redirect ออกไป = submit สำเร็จ (ส่วนใหญ่)
      showOk('pending');
      return;
    }
    let data;
    try { data = JSON.parse(text); } catch(_) { showOk('pending'); return; }
    if (data && data.success) showOk(data.status || 'pending');
    else toast('❗ ' + (data && data.error ? data.error : 'เกิดข้อผิดพลาด'), false);
  } catch(_) {
    // Cross-origin 読めない = GAS redirect ออกไป = สำเร็จ
    showOk('pending');
  }
};

/* ── LIFF ──────────────────────────────── */
async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (liff.isLoggedIn()) await loadProfile();
    else liff.isInClient() ? liff.login() : showNoLogin();
  } catch(e) { console.error('LIFF:', e); showNoLogin(); }
}

async function loadProfile() {
  profile = await liff.getProfile();
  document.getElementById('pName').textContent = profile.displayName;
  document.getElementById('pStat').textContent = '✅ เข้าสู่ระบบแล้ว';
  document.getElementById('lBtn').style.display = 'none';
  if (profile.pictureUrl)
    document.getElementById('ava').innerHTML = '<img src="'+profile.pictureUrl+'">';
  showForm();
}

function showNoLogin() {
  document.getElementById('pName').textContent = 'ยังไม่ได้เข้าสู่ระบบ';
  document.getElementById('pStat').textContent = 'กรุณา Login LINE ก่อน';
  document.getElementById('lBtn').style.display = 'block';
  document.getElementById('noln').style.display = 'block';
}

function doLogin() { liff.login({ redirectUri: location.href }); }

function showForm() {
  document.getElementById('noln').style.display = 'none';
  ['cImg','cSoc','cMsg','subWrap'].forEach(id => document.getElementById(id).style.display='block');
}

/* ── IMAGE ─────────────────────────────── */
function triggerFile() { document.getElementById('fileInput').click(); }

function onFile(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 10*1024*1024) { toast('รูปใหญ่เกิน 10 MB', false); return; }
  compress(f);
}

function compress(file) {
  const pw = document.getElementById('progWrap');
  const pb = document.getElementById('progBar');
  pw.style.display = 'block'; pb.style.width = '20%';

  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      pb.style.width = '60%';
      let w = img.width, h = img.height;
      if (w > MAX_PX || h > MAX_PX) {
        if (w > h) { h = Math.round(h*MAX_PX/w); w = MAX_PX; }
        else       { w = Math.round(w*MAX_PX/h); h = MAX_PX; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      imgB64 = c.toDataURL('image/jpeg', QUALITY);
      pb.style.width = '100%';
      setTimeout(() => { pw.style.display='none'; pb.style.width='0%'; showPreview(imgB64); }, 350);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function showPreview(b64) {
  document.getElementById('prevImg').src = b64;
  document.getElementById('prevImg').style.display = 'block';
  document.getElementById('rmBtn').style.display = 'block';
  document.getElementById('dz').querySelectorAll('.dz-ico,.dz-txt,.dz-sub')
    .forEach(el => el.style.display='none');
}

function rmImg(e) {
  e.stopPropagation(); imgB64 = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('prevImg').style.display = 'none';
  document.getElementById('rmBtn').style.display = 'none';
  document.getElementById('dz').querySelectorAll('.dz-ico,.dz-txt,.dz-sub')
    .forEach(el => el.style.display='');
}

const dzEl = document.getElementById('dz');
dzEl.addEventListener('dragover',  e => { e.preventDefault(); dzEl.classList.add('over'); });
dzEl.addEventListener('dragleave', () => dzEl.classList.remove('over'));
dzEl.addEventListener('drop', e => {
  e.preventDefault(); dzEl.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) compress(f);
});

function cc() { document.getElementById('cn').textContent = document.getElementById('msg').value.length; }

/* ══════════════════════════════════════
   SUBMIT — ส่งผ่าน hidden form → iframe
   วิธีนี้ไม่โดน CORS block เพราะ browser
   อนุญาต form submission ข้าม origin เสมอ
══════════════════════════════════════ */
function doSubmit() {
  if (!profile) { toast('กรุณาเข้าสู่ระบบก่อน', false); return; }
  if (!imgB64)  { toast('กรุณาเลือกรูปภาพ', false);     return; }

  // ใส่ข้อมูลลง hidden form
  document.getElementById('fUserId').value  = profile.userId;
  document.getElementById('fName').value    = profile.displayName;
  document.getElementById('fPic').value     = profile.pictureUrl || '';
  document.getElementById('fImg').value     = imgB64;
  document.getElementById('fFb').value      = document.getElementById('fb').value.trim();
  document.getElementById('fIg').value      = document.getElementById('ig').value.trim();
  document.getElementById('fMsg').value     = document.getElementById('msg').value.trim();

  // ชี้ form ไปที่ GAS URL
  document.getElementById('gasForm').action = GAS_URL;

  loading(true);

  // submit ผ่าน iframe — ไม่ navigate หน้า
  document.getElementById('gasForm').submit();

  // safety timeout 90 วิ (รูปใหญ่ใช้เวลา GAS บันทึก Drive)
  submitTimeout = setTimeout(() => {
    loading(false);
    // ถ้า timeout = น่าจะส่งสำเร็จแต่ iframe อ่าน response ไม่ได้
    showOk('pending');
  }, 90000);
}

function showOk(status) {
  clearTimeout(submitTimeout);
  ['cImg','cSoc','cMsg','subWrap'].forEach(id => document.getElementById(id).style.display='none');
  document.getElementById('okBox').style.display = 'block';
  document.getElementById('okMsg').innerHTML = status === 'approved'
    ? 'รูปได้รับการอนุมัติอัตโนมัติ<br>กำลังขึ้นจอเลย! 🎉'
    : 'รูปของคุณกำลังรอการอนุมัติ<br>และจะขึ้นจอในไม่ช้า ✨';
}

function resetForm() {
  imgB64 = null;
  ['fileInput','fb','ig','msg'].forEach(id => { try{ document.getElementById(id).value=''; }catch(_){} });
  cc();
  document.getElementById('prevImg').style.display = 'none';
  document.getElementById('rmBtn').style.display   = 'none';
  document.getElementById('dz').querySelectorAll('.dz-ico,.dz-txt,.dz-sub')
    .forEach(el => el.style.display='');
  document.getElementById('okBox').style.display = 'none';
  ['cImg','cSoc','cMsg','subWrap'].forEach(id => document.getElementById(id).style.display='block');
}

function loading(on) {
  document.getElementById('subBtn').disabled  = on;
  document.getElementById('sp').style.display = on ? 'block' : 'none';
  document.getElementById('bTxt').textContent = on ? 'กำลังส่ง...' : '🚀 ส่งรูปขึ้นจอ';
}

function toast(msg, ok=true) {
  const el = document.getElementById('toast');
  document.getElementById('tIco').textContent = ok ? '✅' : '❌';
  document.getElementById('tTxt').textContent = msg;
  el.className = 'toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(ttTimer);
  ttTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

window.addEventListener('load', initLiff);
</script>
</body>
</html>
